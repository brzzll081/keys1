<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Licencias</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(181, 23, 158, 0.15);
            text-align: center;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.sub {
            font-size: 13px;
            color: #888888;
            margin-bottom: 25px;
        }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-duracion {
            background: #181818;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-duracion:hover {
            background: #b5179e;
            border-color: #d946ef;
            transform: translateY(-2px);
        }

        .result-box {
            background: #0d0d0d;
            border: 1px dashed #b5179e;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            display: none;
        }

        .key-text {
            font-family: monospace;
            font-size: 18px;
            color: #d946ef;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-text {
            font-size: 11px;
            color: #aaaaaa;
        }

        .btn-copiar {
            margin-top: 10px;
            background: transparent;
            border: 1px solid #d946ef;
            color: #d946ef;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
        }

        .btn-copiar:hover {
            background: #d946ef;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KEY GENERATOR</h1>
        <p class="sub">Panel Administrador Local</p>

        <div class="grid-buttons">
            <button class="btn-duracion" onclick="generarKey(1)">1 Día</button>
            <button class="btn-duracion" onclick="generarKey(3)">3 Días</button>
            <button class="btn-duracion" onclick="generarKey(7)">7 Días</button>
            <button class="btn-duracion" onclick="generarKey(365)">365 Días</button>
        </div>

        <div id="resultBox" class="result-box">
            <div id="keyDisplay" class="key-text">KEY-XXXXXXXX</div>
            <div id="infoDisplay" class="info-text">Expira en: --</div>
            <button class="btn-copiar" onclick="copiarKey()">Copiar Key</button>
        </div>
    </div>

    <script>
        async function generarKey(dias) {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/generar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dias: dias })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('keyDisplay').innerText = data.key;
                    document.getElementById('infoDisplay').innerText = `Válida por ${data.dias} día(s) - Expira: ${data.expira}`;
                    document.getElementById('resultBox').style.display = 'block';
                } else {
                    alert('Error generando Key');
                }
            } catch (error) {
                alert('No se pudo conectar con el programa en Python. Asegúrate de tener app.py abierto.');
            }
        }

        function copiarKey() {
            const key = document.getElementById('keyDisplay').innerText;
            navigator.clipboard.writeText(key);
            alert('¡Key copiada al portapapeles!');
        }
    </script>
</body>
</html>
